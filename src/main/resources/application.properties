spring.application.name=docai
server.port=8081

# ---- MySQL 8 (database is created automatically if it does not exist) ----
spring.datasource.url=jdbc:mysql://localhost:3306/docai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Mani#2004
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ---- Security ----
# Use a long random value in real deployments (at least 32 characters).
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-at-least-32-chars}
app.jwt.expiration-minutes=720

# ---- AI provider: ollama (local, free) or openai ----
ai.provider=${AI_PROVIDER:ollama}

ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
ai.ollama.chat-model=${OLLAMA_CHAT_MODEL:llama3.2}
ai.ollama.embed-model=${OLLAMA_EMBED_MODEL:nomic-embed-text}

ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
ai.openai.embed-model=${OPENAI_EMBED_MODEL:text-embedding-3-small}

# ---- RAG settings ----
rag.chunk-size=900
rag.chunk-overlap=150
rag.top-k=4
rag.embed-batch-size=16
